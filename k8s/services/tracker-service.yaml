apiVersion: v1
kind: Service
metadata:
  name: tracker-service
  namespace: mta
  labels:
    app.kubernetes.io/name: tracker-service
spec:
  selector:
    app.kubernetes.io/name: tracker-service
  ports:
    - name: grpc
      port: 50053
      targetPort: 50053
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker-service
  namespace: mta
  labels:
    app.kubernetes.io/name: tracker-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tracker-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracker-service
    spec:
      initContainers:
        - name: migrate
          image: mta/tracker-service:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DEFAULT_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mta-secrets
                  key: TRACKER_DATABASE_URL
            - name: SYNC_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mta-secrets
                  key: TRACKER_SYNC_DATABASE_URL
      containers:
        - name: tracker-service
          image: mta/tracker-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50053
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mta-secrets
                  key: TRACKER_SECRET_KEY
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: mta-config
                  key: DEBUG
            - name: DEFAULT_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mta-secrets
                  key: TRACKER_DATABASE_URL
            - name: SYNC_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mta-secrets
                  key: TRACKER_SYNC_DATABASE_URL
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: mta-secrets
                  key: CELERY_BROKER_URL
            - name: GRPC_AUTH_HOST
              valueFrom:
                configMapKeyRef:
                  name: mta-config
                  key: GRPC_AUTH_HOST
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
