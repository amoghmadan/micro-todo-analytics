apiVersion: v1
kind: Service
metadata:
  name: task-db
  namespace: mta
  labels:
    app.kubernetes.io/name: task-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: task-db
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: task-db
  namespace: mta
  labels:
    app.kubernetes.io/name: task-db
spec:
  serviceName: task-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: task-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-db
    spec:
      containers:
        - name: mongodb
          image: mongodb/mongodb-community-server:latest
          ports:
            - name: mongodb
              containerPort: 27017
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: task-db-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: task-db-data
  namespace: mta
  labels:
    app.kubernetes.io/name: task-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
